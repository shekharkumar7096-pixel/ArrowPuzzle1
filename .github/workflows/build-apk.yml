name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          java -version
          VERSION_LINE=$(java -version 2>&1 | head -n 1 || true)
          MAJOR_VERSION=$(printf '%s\n' "$VERSION_LINE" | sed -nE 's/.*version "([0-9]+)(\.[0-9]+)?.*".*/\1/p')
          if [ -z "$MAJOR_VERSION" ]; then
            echo "::error::Failed to detect active Java version from: $VERSION_LINE"
            exit 1
          fi
          if [ "$MAJOR_VERSION" = "1" ]; then
            MAJOR_VERSION=$(printf '%s\n' "$VERSION_LINE" | sed -nE 's/.*version "1\.([0-9]+).*".*/\1/p')
          fi
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]] || [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected major version '$MAJOR_VERSION'."
            exit 1
          fi
          echo "Confirmed Java major version: $MAJOR_VERSION"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "Existing ./debug.keystore detected; skipping generation."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              echo "::error::keytool not found at $KEYTOOL_BIN"
              exit 1
            fi
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1 || {
                echo "::error::Failed to create temporary ./debug.keystore"
                exit 1
              }
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::./debug.keystore is missing or empty after generation."
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists."

      - name: Build debug APK
        id: build_debug_apk
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected debug APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::$APK_PATH is not a regular file."
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH is empty."
            exit 1
          fi
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "::error::$APK_PATH does not have the .apk extension."
            exit 1
          fi
          echo "Verified debug APK: $APK_PATH"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          RAW_REPO="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO=$(printf '%s' "$RAW_REPO" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="android-app"
          fi
          ASSET_DIR=$(mktemp -d "${RUNNER_TEMP}/release-asset-XXXXXX")
          ASSET_NAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"
          cp "$APK_PATH" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to copy verified APK to $ASSET_PATH"
            exit 1
          fi
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          {
            echo "asset_path=${ASSET_PATH}"
            echo "asset_name=${ASSET_NAME}"
            echo "release_tag=${RELEASE_TAG}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
          RELEASE_TAG: ${{ steps.prepare_release_asset.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.prepare_release_asset.outputs.release_title }}
        run: |
          set -euo pipefail
          gh --version
          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release APK asset is missing or invalid."
            exit 1
          fi
          NOTES_FILE=$(mktemp "${RUNNER_TEMP}/release-notes-XXXXXX.md")
          printf '%s\n' \
            "This is an automatically generated debug APK built by GitHub Actions." \
            "" \
            "- **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}" \
            "- **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}" \
            "- **Source Commit SHA:** ${GITHUB_SHA}" \
            "- **Asset Filename:** ${ASSET_NAME}" \
            "" \
            "> **Testing Build Only:** This APK is intended for testing, is signed only with a temporary debug keystore, and is **not** a Google Play Store production release." \
            > "$NOTES_FILE"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload_artifact.outcome }}
          BUILD_OUTCOME: ${{ steps.build_debug_apk.outcome }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
          RELEASE_TAG: ${{ steps.prepare_release_asset.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.prepare_release_asset.outputs.release_title }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url)
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"
            {
              echo "## Debug APK Published to GitHub Releases"
              echo ""
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Page:** ${RELEASE_URL}"
              echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
              echo ""
              echo "You can download the APK directly from the **Assets** section on the GitHub Release page above. The GitHub Actions artifact \`app-debug-apk\` is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed (outcome: ${PUBLISH_OUTCOME})."
            echo "APK build outcome: ${BUILD_OUTCOME}"
            echo "Actions artifact (app-debug-apk) outcome: ${ARTIFACT_OUTCOME}"
            {
              echo "## Debug APK Build Summary (Release Publishing Failed)"
              echo ""
              echo "> **Warning:** GitHub Release publishing failed (step outcome: \`${PUBLISH_OUTCOME}\`)."
              echo ""
              if [ "$BUILD_OUTCOME" = "success" ]; then
                echo "- The debug APK build **succeeded**."
              else
                echo "- The debug APK build did not succeed (step outcome: \`${BUILD_OUTCOME}\`)."
              fi
              if [ "$ARTIFACT_OUTCOME" = "success" ]; then
                echo "- The backup GitHub Actions artifact named \`app-debug-apk\` remains available for download."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
